[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"

# Serve TikTok signature when crawler hits the URL prefix folder
[[redirects]]
  from = "/tiktok"
  to = "/tiktok/tiktokHlHGaGmnnnw3wddCo0dAcnJ4nt3vDBWH.txt"
  status = 200
  force = true

[[redirects]]
  from = "/tiktok/"
  to = "/tiktok/tiktokHlHGaGmnnnw3wddCo0dAcnJ4nt3vDBWH.txt"
  status = 200
  force = true

# Proxy BE API for browser calls on Netlify static hosting
[[redirects]]
  from = "/api/be/*"
  to = "https://1f383m5q-3000.asse.devtunnels.ms/:splat"
  status = 200
  force = true

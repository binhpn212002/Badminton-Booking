[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"

# Avoid 301 for legal pages (TikTok URL checks often fail on redirects)
[[redirects]]
  from = "/terms"
  to = "/terms/"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 200
  force = true

# Proxy BE API for browser calls on Netlify static hosting
[[redirects]]
  from = "/api/be/*"
  to = "https://1f383m5q-3000.asse.devtunnels.ms/:splat"
  status = 200
  force = true

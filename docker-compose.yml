# Frontend only (Nuxt static + nginx)
#
#   docker compose up -d --build
#
# Host reverse proxy (Nginx/Caddy) → http://127.0.0.1:8080

services:
  fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://spt-api.pnmn.click}
        NUXT_PUBLIC_API_ORIGIN: ${NUXT_PUBLIC_API_ORIGIN:-https://spt-api.pnmn.click}
    container_name: badminton-fe
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - badminton

networks:
  badminton:
    name: badminton
    external: true
